<body>

    <form>
        <label for="fname">First Name</label>
        <input type="text" name="fname"><br><br>

        <label for="lname">Last Name</label>
        <input type="text" name="lnmae"><br><br>

        <label for="email">Email</label>
        <input type="email" name="email"><br><br>

        <label for="gender">Gender</label>
        <input type="radio" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label for="phone">Phone number</label>
        <input type="tel" name="phone" placeholder="Whatsapp number"><br><br>

        <label for="city">City</label>
        <input type="text" name="city"><br><br>

        <label for="lang">Language Known:</label>
        <input type="checkbox" name="language" value="java">
        <label for="java">Java</label>
        <input type="checkbox" name="language" value="python">
        <label for="python">Python</label>
        <input type="checkbox" name="language" value="javascript">
        <label for="javascrip">JavaScript</label><br><br>

        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
